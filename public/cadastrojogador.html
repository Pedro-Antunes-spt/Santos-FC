<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Jogadores - Santos FC</title>
    <link rel="stylesheet" href="./css/cadastrojogador.css">
</head>

<body onload="listar()">

    <div class="container">

        <div class="cabecalho">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Santos_Logo.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail_unscaled&_=20230206125350"
                alt="Santos FC">
            <h1>Cadastro de jogadores</h1>
        </div>

        <div class="card-cadastro">

            <form>

                <div class="campos">

                    <div class="campo">
                        <label for="ipt_nome">Nome</label>
                        <input type="text" id="ipt_nome" placeholder="Nome do jogador" required>
                    </div>

                    <div class="campo">
                        <label for="slc_posicao">Posição</label>

                        <select id="slc_posicao" required>
                            <option value="">Selecione</option>
                            <option value="1">Goleiro</option>
                            <option value="2">Zagueiro</option>
                            <option value="3">Lateral</option>
                            <option value="4">Volante</option>
                            <option value="5">Meio-campista</option>
                            <option value="6">Atacante</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="ipt_idade">Idade</label>
                        <input type="number" id="ipt_idade" min="16" max="50" placeholder="Ex.: 22" required>
                    </div>

                    <div class="campo">
                        <label for="ipt_camisa">Camisa</label>
                        <input type="number" id="ipt_camisa" min="1" max="99" placeholder="Ex.: 10" required>
                    </div>

                    <div class="campo">
                        <label for="ipt_nota">Nota geral</label>
                        <input type="number" id="ipt_nota" min="0" max="100" placeholder="0 a 100" required>
                    </div>

                </div>

                <button type="button" id="btn_cadastrar" onclick="cadastrar()">
                    + Cadastrar jogador
                </button>

                <div id="mensagem_erro"></div>

            </form>

        </div>

        <div class="card-tabela">

            <h2>Jogadores cadastrados</h2>

            <div class="tabela">

                <div class="linha cabecalho-tabela">
                    <div>ID</div>
                    <div>Nome</div>
                    <div>Posição</div>
                    <div>Idade</div>
                    <div>Camisa</div>
                    <div>Nota geral</div>
                    <div>Favorito</div>
                </div>

                <div id="lista_jogadores">

                </div>

            </div>

        </div>

        <a class="voltar" href="dashboard.html">
            Voltar para a dashboard
        </a>

    </div>

    <script>

        let idUsuario = sessionStorage.ID_USUARIO;

        if (!idUsuario) {
            window.location = "loginusuario.html";
        }

        function cadastrar() {

            let nome = ipt_nome.value.trim();
            let posicao = slc_posicao.value;
            let idade = ipt_idade.value;
            let camisa = ipt_camisa.value;
            let nota = ipt_nota.value;

            let mensagem = document.getElementById("mensagem_erro");

            mensagem.style.color = "red";

            if (nome == "" || posicao == "" || idade == "" ||
                camisa == "" || nota == "") {

                mensagem.innerHTML = "Preencha todos os campos!";
                return false;
            }

            if (idade < 16 || idade > 50) {
                mensagem.innerHTML = "A idade deve estar entre 16 e 50 anos!";
                return false;
            }

            if (camisa < 1 || camisa > 99) {
                mensagem.innerHTML = "A camisa deve estar entre 1 e 99!";
                return false;
            }

            if (nota < 0 || nota > 100) {
                mensagem.innerHTML = "A nota deve estar entre 0 e 100!";
                return false;
            }

            if (btn_cadastrar.disabled) {
                return false;
            }

            btn_cadastrar.disabled = true;

            fetch("/jogadores/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idUsuarioServer: idUsuario,
                    nomeServer: nome,
                    posicaoServer: posicao,
                    idadeServer: idade,
                    camisaServer: camisa,
                    notaServer: nota
                })
            })
                .then(function (resposta) {

                    btn_cadastrar.disabled = false;

                    if (resposta.ok) {

                        mensagem.style.color = "green";
                        mensagem.innerHTML = "Jogador cadastrado com sucesso!";

                        ipt_nome.value = "";
                        slc_posicao.value = "";
                        ipt_idade.value = "";
                        ipt_camisa.value = "";
                        ipt_nota.value = "";

                        listar();

                    } else {
                        resposta.text().then(function (erro) {
                            mensagem.textContent = erro;
                            console.log("Status:", resposta.status);
                            console.log("Erro:", erro);
                        });
                    }

                })
                .catch(function (erro) {

                    console.log(erro);
                    btn_cadastrar.disabled = false;
                    mensagem.innerHTML = "Erro ao conectar com o servidor!";

                });
        }

        function listar() {

            if (!idUsuario) {
                return;
            }

            fetch(`/jogadores/listar/${idUsuario}`)
                .then(function (resposta) {

                    if (resposta.ok) {
                        return resposta.json();
                    }

                    throw new Error("Erro ao listar jogadores!");

                })
                .then(function (jogadores) {

                    lista_jogadores.innerHTML = "";

                    for (let i = 0; i < jogadores.length; i++) {

                        let jogador = jogadores[i];

                        let linha = document.createElement("div");

                        linha.className = "linha";

                        let dados = [
                            jogador.idJogador,
                            jogador.nome,
                            jogador.nomePosicao,
                            jogador.idade,
                            jogador.numeroCamisa,
                            jogador.notaGeral
                        ];

                        for (let j = 0; j < dados.length; j++) {

                            let coluna = document.createElement("div");

                            coluna.textContent = dados[j];

                            linha.appendChild(coluna);
                        }

                        let colunaFavorito = document.createElement("div");

                        let estrela = document.createElement("button");

                        estrela.type = "button";
                        estrela.className = "btn-favorito";

                        if (jogador.idFavorito != null) {

                            estrela.innerHTML = "★";
                            estrela.classList.add("favoritado");

                        } else {

                            estrela.innerHTML = "☆";

                        }

                        estrela.onclick = function () {

                            estrela.disabled = true;

                            alterarFavorito(
                                jogador.idJogador,
                                jogador.idFavorito,
                                estrela
                            );
                        };

                        colunaFavorito.appendChild(estrela);

                        linha.appendChild(colunaFavorito);

                        lista_jogadores.appendChild(linha);
                    }

                })
                .catch(function (erro) {

                    console.log(erro);

                    lista_jogadores.textContent =
                        "Erro ao carregar jogadores!";

                });
        }

        function alterarFavorito(idJogador, idFavorito, estrela) {

            let rota = "/jogadores/favoritar";
            let metodo = "POST";

            if (idFavorito != null) {

                rota = "/jogadores/desfavoritar";
                metodo = "DELETE";

            }

            fetch(rota, {

                method: metodo,

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    idUsuarioServer: idUsuario,
                    idJogadorServer: idJogador
                })

            })
                .then(function (resposta) {

                    if (resposta.ok) {

                        listar();

                    } else {

                        estrela.disabled = false;
                        alert("Erro ao alterar favorito!");

                    }

                })
                .catch(function (erro) {

                    estrela.disabled = false;
                    console.log(erro);

                    alert("Erro ao conectar com o servidor!");

                });
        }

    </script>

</body>

</html>
