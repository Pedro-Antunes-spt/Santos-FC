<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Santos FC</title>
    <link rel="stylesheet" href="./css/loginusuario.css">
</head>
<body>
    <div class="tela-login">

        <div class="area-login">

            <h1>Login</h1>

            <form>

                <input type="email"
                       placeholder="E-mail"
                       required> 

                <input type="password"
                       placeholder="Senha"
                       required>

                <button type="submit">Entrar</button>

            </form>

        </div>

        <div class="imagem-login">
            <img src="./assets/imgs/images (1).jpg"
                 alt="Vila Belmiro">
        </div>

    </div>
</body>
</html>
